# 日報複合ツールのデスクトップ版(Windows)を作って確かめる
#
# 作るもの: AllTools.exe(成果物 "AllTools-windows" から取れる)。
# 配るときは、一式のフォルダの直下(bridge.py・config と同じ所)に置いてから
# scripts\make_dist.bat を流す(「日報複合ツール.exe」の名前で入る)。
#
# 確かめること:
#   - 入口(portal)と4つのツールの Python の試験(Windows の上で。標準入出力のやりとり・
#     錠(名前付きミューテックス・ファイルの錠)は OS で違いが出やすい)
#   - Rust の試験
#   - 作った exe を本当に起動し、大きなタブと4つのツールの画面が届くこと・ポートで
#     待ち受けないこと・ブラウザ版が後から開けば止まること・止めたら Python も終わること
#     (scripts/desktop_smoke.py)
name: デスクトップ版(Windows)

on:
  push:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: 入口, dir: ".", args: "-s tests -t ." }
          - { name: 日報, dir: "tools/nippou", args: "-s tests", browser: "1" }
          - { name: 看板, dir: "tools/kanban", args: "-s tests" }
          - { name: カレンダー, dir: "tools/calendar", args: "-s tests -t .", browser: "1" }
          - { name: 点検表, dir: "tools/inspection", args: "-s tests -t ." }
    name: Python の試験(${{ matrix.part.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python の部品を入れる
        run: python -m pip install -r requirements.txt

      # 画面の試験(本物の Chromium で印刷の余白・複数タブ・振り返りの収まり)。
      # 試験の道具なので requirements.txt には入れない(ラインPCには入れない)
      - name: 画面の試験の道具を入れる
        if: ${{ matrix.part.browser == '1' }}
        run: |
          python -m pip install playwright==1.49.1
          python -m playwright install chromium

      - name: Python の試験
        working-directory: ${{ matrix.part.dir }}
        env:
          PYTHONIOENCODING: utf-8
          # 画面の試験を飛ばしたまま緑にしない(道具を入れたジョブだけ)
          ALLTOOLS_REQUIRE_BROWSER: ${{ matrix.part.browser }}
        run: python -m unittest discover ${{ matrix.part.args }}

  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python の部品を入れる
        run: python -m pip install -r requirements.txt

      - name: 入口のデスクトップ版の入口の試験(ソケットを塞いで起動する)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -t . -p test_bridge.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust の試験
        working-directory: src-tauri
        run: cargo test --release

      - name: exe を作る
        working-directory: src-tauri
        run: cargo build --release

      - name: 作った exe を起動して確かめる
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/desktop_smoke.py --exe src-tauri/target/release/AllTools.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AllTools-windows
          path: src-tauri/target/release/AllTools.exe
          if-no-files-found: error
