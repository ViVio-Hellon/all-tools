# デスクトップ版の外枠(Rust/Tauri)。業務の処理は Python(`bridge.py`)が持つ。
# ここが持つのは: 窓・Python の起動と監視・多重起動の防止・終了の確認・帳票の窓・
# 保存/選択の標準ダイアログ・モード切替での立て直し。詳しくは docs/デスクトップ版.md
[package]
name = "kanban-system-desktop"
version = "3.1.0"
edition = "2021"
publish = false

[[bin]]
name = "KanbanSystem"
path = "src/main.rs"

[features]
# `cargo build --release` だけで配れる exe にする(Tauri の作法)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
