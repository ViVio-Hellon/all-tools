# 日報複合ツール デスクトップ版の外枠(Rust/Tauri)。業務の処理は各ツールの Python(`tools/<名前>/bridge.py`)が持つ。
# ここが持つのは: 1つの窓・大きなタブに載せる各ツールの Python の起動と監視・宛先ごとの振り分け・
# 画面の部品を返すこと・別窓・保存/選択の標準ダイアログ・多重起動とブラウザ版との同時起動の防止・
# まとめた終了の確認。詳しくは docs/デスクトップ版.md
[package]
name = "all-tools-desktop"
version = "1.4.0"
edition = "2021"
publish = false

[[bin]]
name = "AllTools"
path = "src/main.rs"

[features]
# `cargo build --release` だけで配れる exe にする(Tauri の作法)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
